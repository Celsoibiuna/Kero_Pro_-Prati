# =====================================================================
# KeroPro backend - configuracao da aplicacao
# =====================================================================
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/keropro?useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=senha_do_mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# CORS: origem do front-end React em desenvolvimento
keropro.cors.allowed-origin=http://localhost:3000

# JWT - chave de assinatura HS256 (minimo 32 bytes) e tempo de expiracao do token de sessao.
# Em producao, definir a variavel de ambiente KEROPRO_JWT_SECRET com um valor aleatorio
# e nunca versionar o valor real dessa chave.
keropro.jwt.secret=${KEROPRO_JWT_SECRET:chave-secreta-de-desenvolvimento-trocar-em-producao-0000}
keropro.jwt.expiracao-minutos=120
